name: Compilar APK Android
on:
  push:
    branches: [main, master, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK do runner
        run: test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar atlas original
        run: python3 tools/verify_atlas.py
      - name: Testar lógica Java
        run: bash ./tools/test-core.sh
      - name: Testar controles e ciclo de vida
        run: gradle :core:auditControls :lwjgl3:installDist --no-daemon
      - name: Auditar APIs e recursos Android
        run: gradle :android:lintDebug --no-daemon
      - name: Compilar APK de teste
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - name: Confirmar atlas incluido no APK
        run: |
          unzip -l android/build/outputs/apk/debug/*.apk | grep -F 'assets/city/atlas.png'
      - name: Confirmar identidade do app de testes
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/*.apk | grep "package: name='br.com.cidadeviva.game.dev'"
      - uses: actions/upload-artifact@v4
        with:
          name: CidadeViva-Android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
