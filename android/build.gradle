plugins { id 'com.android.application' }
android {
    namespace 'br.com.cidadeviva.android'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.cidadeviva.game'
        minSdk 23
        targetSdk 35
        versionCode 14
        versionName '0.4.0-alpha5-economia' 
    }
    sourceSets { main { jniLibs.srcDirs = ['libs']; assets.srcDirs = ['assets'] } }
    signingConfigs {
        // Public DEV-ONLY key: debug package is distinct from the release app.
        // Never use this key or package identity for production builds.
        cityDebug {
            storeFile file('dev-debug.keystore')
            storePassword 'android'
            keyAlias 'cidade-viva-dev'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            signingConfig signingConfigs.cityDebug
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt'] }
    }
}
configurations { natives }
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
}
tasks.register('copyAndroidNatives') {
    outputs.dir(layout.projectDirectory.dir('libs'))
    doLast {
        configurations.natives.files.each { jar ->
            def abi = null
            ['arm64-v8a','armeabi-v7a','x86_64'].each { platform ->
                if (jar.name.endsWith("natives-${platform}.jar")) abi = platform
            }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("libs/${abi}")
                    include '*.so'
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('copyAndroidNatives') }

// libGDX Android 1.14.2 transitively resolves AndroidX Core 1.17 (requires SDK 36).
// Keep compileSdk 35 / AGP 8.7.3 compatible for Android APK debug builds.
configurations.configureEach { resolutionStrategy.force("androidx.core:core:1.16.0") }

