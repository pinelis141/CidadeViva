plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
application { mainClass = 'br.com.cidadeviva.desktop.DesktopLauncher' }
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
}

tasks.named("run").configure { workingDir = project(":android").file("assets") }

// Pack atlas assets for installed/distributed desktop builds as well as gradle run.
sourceSets.main.resources.srcDir project(':android').file('assets')
